{{/* Copernicus Marine layer map */}}
<section class="section">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <h2 class="mb-8 text-center">
          Near Real Time Ocean Conditions
        </h2>

        <link
          rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />

        <div class="flex justify-center w-full">
          <div
            id="sstAnomalyMap"
            class="rounded-xl shadow-lg border border-border z-0"
            style="
              height: 600px;
              width: 100%;
              min-width: 100%;
              position: relative;
            "
          ></div>
        </div>

        <p class="mt-4 text-center text-sm" id="mapCaption">
          Data updated daily courtesy of
          
            href="https://marine.copernicus.eu/"
            target="_blank"
            rel="noopener"
            class="underline"
            >Copernicus Marine Service (CMEMS)</a
          >.
        </p>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <script>
          (function () {
            document.addEventListener("DOMContentLoaded", function () {
              const LAYERS = [
                {
                  name: "Sea Surface Temperature Anomaly",
                  layer:
                    "GLOBAL_ANALYSISFORECAST_PHY_001_024/cmems_mod_glo_phy_anfc_0.083deg-sst-anomaly_P1D-m_202411/sea_surface_temperature_anomaly",
                  style: "cmap:balance,range:-6/6",
                  caption:
                    "Today's sea surface temperature compared to a monthly climatology baseline (1993-2016).",
                  legend: { wrapperWidth: 110, imgWidth: 160 },
                },
                {
                  name: "Sea Surface Temperature",
                  layer:
                    "GLOBAL_ANALYSISFORECAST_PHY_001_024/cmems_mod_glo_phy_anfc_0.083deg_PT1H-m_202406/thetao",
                  style: "cmap:thermal",
                  caption: "Sea surface temperature.",
                  legend: { wrapperWidth: 110, imgWidth: 160 },
                },
                {
                  name: "Salinity",
                  layer:
                    "GLOBAL_ANALYSISFORECAST_PHY_001_024/cmems_mod_glo_phy_anfc_0.083deg_PT1H-m_202406/so",
                  style: "cmap:haline",
                  caption: "Sea surface salinity.",
                  legend: { wrapperWidth: 110, imgWidth: 160 },
                },
                {
                  name: "Chlorophyll-a",
                  layer:
                    "GLOBAL_ANALYSISFORECAST_BGC_001_028/cmems_mod_glo_bgc-pft_anfc_0.25deg_P1D-m_202311/chl",
                  style: "cmap:algae",
                  caption: "Surface chlorophyll-a concentration.",
                  legend: { wrapperWidth: 120, imgWidth: 160 },
                 }, 
                {
                  name: "Sea Water Velocity",
                  layer:
                    "GLOBAL_ANALYSISFORECAST_PHY_001_024/cmems_mod_glo_phy_anfc_0.083deg_PT1H-m_202406/sea_water_velocity",
                  style: "cmap:speed,vectorStyle:solidAndVector",
                  caption: "Surface sea water velocity.",
                  legend: { wrapperWidth: 110, imgWidth: 160 },
                }
              ];

              let currentLayerIndex = 0;
              let activeTileLayer = null;

              const map = L.map("sstAnomalyMap", {
                center: [-41.2710849, 173.2836756],
                zoom: 3,
                scrollWheelZoom: false,
                dragging: !L.Browser.mobile,
                tap: false,
              });

              L.control.scale({ imperial: false }).addTo(map);

              const container = map.getContainer();

              const hint = document.createElement("div");
              hint.textContent = "Hold Ctrl / ⌘ Cmd to zoom";
              hint.className = "map-glass-light";
              Object.assign(hint.style, {
                position: "absolute",
                top: "50%",
                left: "50%",
                transform: "translate(-50%, -50%)",
                pointerEvents: "none",
                opacity: "0",
                transition: "opacity 0.2s",
                zIndex: "1000",
              });
              container.style.position = "relative";
              container.appendChild(hint);

              let hintTimeout;
              function showHint() {
                hint.style.opacity = "1";
                clearTimeout(hintTimeout);
                hintTimeout = setTimeout(() => {
                  hint.style.opacity = "0";
                }, 1500);
              }

              container.addEventListener(
                "wheel",
                function (e) {
                  if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    e.stopPropagation();
                    const delta = e.deltaY < 0 ? 1 : -1;
                    map.setZoom(map.getZoom() + delta);
                  } else {
                    showHint();
                  }
                },
                { passive: false },
              );

              const touchHint = document.createElement("div");
              touchHint.textContent = "Use two fingers to pan the map";
              touchHint.className = "map-glass-light";
              Object.assign(touchHint.style, {
                position: "absolute",
                top: "50%",
                left: "50%",
                transform: "translate(-50%, -50%)",
                pointerEvents: "none",
                opacity: "0",
                transition: "opacity 0.2s",
                zIndex: "1000",
                whiteSpace: "nowrap",
              });
              container.appendChild(touchHint);

              let touchHintTimeout;
              function showTouchHint() {
                touchHint.style.opacity = "1";
                clearTimeout(touchHintTimeout);
                touchHintTimeout = setTimeout(() => {
                  touchHint.style.opacity = "0";
                }, 1500);
              }

              let touchHintDelay;

              container.addEventListener(
                "touchstart",
                function (e) {
                  if (e.touches.length === 2) {
                    map.dragging.enable();
                    clearTimeout(touchHintDelay);
                    touchHint.style.opacity = "0";
                  } else {
                    map.dragging.disable();
                    touchHintDelay = setTimeout(() => showTouchHint(), 80);
                  }
                },
                { passive: true },
              );

              container.addEventListener(
                "touchend",
                function (e) {
                  if (e.touches.length < 2) {
                    map.dragging.disable();
                  }
                },
                { passive: true },
              );

              const layerControl = document.createElement("div");
              layerControl.className = "map-glass-light";
              Object.assign(layerControl.style, {
                position: "absolute",
                top: "12px",
                left: "50%",
                transform: "translateX(-50%)",
                zIndex: "1001",
                padding: "4px 4px",
                borderRadius: "20px",
              });

              const select = document.createElement("select");
              Object.assign(select.style, {
                border: "none",
                background: "transparent",
                fontSize: "14px",
                fontWeight: "500",
                cursor: "pointer",
                outline: "none",
              });

              LAYERS.forEach((layerDef, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = layerDef.name;
                select.appendChild(opt);
              });

              select.addEventListener("change", function () {
                currentLayerIndex = parseInt(this.value, 10);
                setLayer(currentLayerIndex);
              });

              layerControl.appendChild(select);
              container.appendChild(layerControl);
              L.DomEvent.disableClickPropagation(layerControl);
              L.DomEvent.disableScrollPropagation(layerControl);

              const colorbar = document.createElement("div");
              colorbar.className = "map-glass-light";
              Object.assign(colorbar.style, {
                position: "absolute",
                top: "50%",
                right: "12px",
                transform: "translateY(-50%)",
                zIndex: "1000",
                padding: "10px 8px",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                pointerEvents: "none",
                borderRadius: "25px",
                transition: "opacity 0.25s, transform 0.25s",
              });

              const imgWrapper = document.createElement("div");
              Object.assign(imgWrapper.style, {
                height: "400px",
                overflow: "hidden",
                borderRadius: "15px",
                flexShrink: "0",
              });

              const img = document.createElement("img");
              img.alt = "Layer colorbar";
              Object.assign(img.style, {
                display: "block",
                width: "160px",
                maxWidth: "none",
                height: "400px",
              });

              imgWrapper.appendChild(img);
              colorbar.appendChild(imgWrapper);
              container.appendChild(colorbar);
              L.DomEvent.disableClickPropagation(colorbar);

              const isMobile = () =>
                window.matchMedia("(max-width: 768px)").matches;
              let colorbarVisible = true;

              const toggleBtn = document.createElement("button");
              toggleBtn.className = "map-glass-light";
              toggleBtn.innerHTML = '<i class="fa-regular fa-chart-bar"></i>';
              toggleBtn.title = "Toggle colorbar";
              Object.assign(toggleBtn.style, {
                position: "absolute",
                top: "12px",
                right: "12px",
                zIndex: "1001",
                width: "34px",
                height: "34px",
                display: "none",
                alignItems: "center",
                justifyContent: "center",
                fontSize: "16px",
                cursor: "pointer",
                border: "none",
                borderRadius: "25px",
                padding: "0",
                lineHeight: "1",
              });

              toggleBtn.addEventListener("click", function () {
                colorbarVisible = !colorbarVisible;
                colorbar.style.opacity = colorbarVisible ? "1" : "0";
                colorbar.style.transform = colorbarVisible
                  ? "translateY(-50%)"
                  : "translateY(-50%) translateX(20px)";
                toggleBtn.title = colorbarVisible
                  ? "Hide colorbar"
                  : "Show colorbar";
              });

              container.appendChild(toggleBtn);
              L.DomEvent.disableClickPropagation(toggleBtn);

              function applyResponsiveState() {
                if (isMobile()) {
                  toggleBtn.style.display = "flex";
                  if (colorbarVisible) {
                    colorbarVisible = false;
                    colorbar.style.opacity = "0";
                    colorbar.style.transform =
                      "translateY(-50%) translateX(20px)";
                    toggleBtn.title = "Show colorbar";
                  }
                } else {
                  toggleBtn.style.display = "none";
                  colorbarVisible = true;
                  colorbar.style.opacity = "1";
                  colorbar.style.transform = "translateY(-50%)";
                }
              }

              applyResponsiveState();
              window.addEventListener("resize", applyResponsiveState);

              function buildTileUrl(layerDef) {
                return (
                  "https://wmts.marine.copernicus.eu/teroWmts" +
                  "?SERVICE=WMTS" +
                  "&REQUEST=GetTile" +
                  "&LAYER=" +
                  encodeURIComponent(layerDef.layer) +
                  "&STYLE=" +
                  layerDef.style +
                  "&FORMAT=image%2Fpng" +
                  "&TILEMATRIXSET=EPSG:3857" +
                  "&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}"
                );
              }

              function buildLegendUrl(layerDef) {
                return (
                  "https://wmts.marine.copernicus.eu/teroWmts" +
                  "?SERVICE=WMTS" +
                  "&REQUEST=GetLegend" +
                  "&LAYER=" +
                  encodeURIComponent(layerDef.layer) +
                  "&STYLE=" +
                  layerDef.style
                );
              }

              const caption = document.getElementById("mapCaption");

              function setLayer(idx) {
                const layerDef = LAYERS[idx];

                if (activeTileLayer) {
                  map.removeLayer(activeTileLayer);
                }

                activeTileLayer = L.tileLayer(buildTileUrl(layerDef), {
                  attribution: "Copernicus Marine Service (CMEMS)",
                  transparent: true,
                  opacity: 1,
                  maxZoom: 10,
                }).addTo(map);

                if (window.__mapOverlayLayers) {
                  window.__mapOverlayLayers.forEach((l) => l.bringToFront());
                }

                const legendSize = layerDef.legend || { wrapperWidth: 110, imgWidth: 160 };
                imgWrapper.style.width = legendSize.wrapperWidth + "px";
                img.style.width = legendSize.imgWidth + "px";


                img.src = buildLegendUrl(layerDef);

                if (caption && layerDef.caption) {
                  caption.innerHTML =
                    layerDef.caption +
                    ' Data updated daily courtesy of <a href="https://marine.copernicus.eu/" target="_blank" rel="noopener" class="underline">Copernicus Marine Service (CMEMS)</a>.';
                }
              }

              map.on("click", function (e) {
                const wrappedLatLng = e.latlng.wrap();
                const zoom = map.getZoom();
                const point = map.project(wrappedLatLng, zoom);
                const tileSize = 256;
                const tileCol = Math.floor(point.x / tileSize);
                const tileRow = Math.floor(point.y / tileSize);
                const i = Math.floor(point.x % tileSize);
                const j = Math.floor(point.y % tileSize);

                const layerDef = LAYERS[currentLayerIndex];
                const infoUrl =
                  `https://wmts.marine.copernicus.eu/teroWmts/?service=WMTS&request=GetFeatureInfo` +
                  `&layer=${encodeURIComponent(layerDef.layer)}` +
                  `&tilematrixset=EPSG:3857&tilematrix=${zoom}&tilerow=${tileRow}&tilecol=${tileCol}` +
                  `&i=${i}&j=${j}&INFOFORMAT=text/html`;

                const popup = L.popup({ className: 'glass-popup'})
                  .setLatLng(e.latlng)
                  .setContent(
                    "<div style='text-align:center; padding:4px;'><em>Fetching value...</em></div>",
                  )
                  .openOn(map);

                fetch(infoUrl)
                  .then((response) => response.text())
                  .then((html) => {
                    if (html && html.includes("<table")) {
                      const parser = new DOMParser();
                      const doc = parser.parseFromString(html, "text/html");
                      const rows = doc.querySelectorAll("tr");

                      let value = null;

                      if (rows.length >= 2) {
                        const headers = rows[0].querySelectorAll("th, td");
                        let valueIndex = -1;

                        headers.forEach((header, index) => {
                          if (
                            header.textContent.trim().toLowerCase() === "value"
                          ) {
                            valueIndex = index;
                          }
                        });

                        if (valueIndex !== -1) {
                          const dataCells = rows[1].querySelectorAll("th, td");
                          if (dataCells.length > valueIndex) {
                            value = parseFloat(
                              dataCells[valueIndex].textContent.trim(),
                            ).toFixed(2);
                          }
                        }
                      }

                      if (value !== null && !isNaN(value)) {
                        popup.setContent(
                          `<div style="text-align:center; padding:4px; font-size:14px;"><strong>${LAYERS[currentLayerIndex].name}</strong><br>${value}</div>`,
                        );
                      } else {
                        popup.setContent(
                          "<div style='text-align:center; padding:4px;'>No data here.</div>",
                        );
                      }
                    } else {
                      popup.setContent(
                        "<div style='text-align:center; padding:4px;'>No data available here.</div>",
                      );
                    }
                  })
                  .catch((err) => {
                    popup.setContent(
                      "<div style='text-align:center; padding:4px; color:red;'>Error retrieving data.</div>",
                    );
                    console.error("GetFeatureInfo Error: ", err);
                  });
              });

              const landStyle = {
                fillColor: "#2c3e50",
                fillOpacity: 1,
                color: "#ffffff",
                weight: 1,
              };

              function addLandAtOffset(data, lngOffset) {
                const l = L.geoJSON(data, {
                  coordsToLatLng: function (coords) {
                    return new L.LatLng(coords[1], coords[0] + lngOffset);
                  },
                  style: landStyle,
                }).addTo(map);
                window.__mapOverlayLayers.push(l);
              }

              const riverStyle = {
                fillOpacity: 0,
                color: "#519ccc",
                weight: 1,
              };

              function addRiverAtOffset(data, lngOffset) {
                const l = L.geoJSON(data, {
                  coordsToLatLng: function (coords) {
                    return new L.LatLng(coords[1], coords[0] + lngOffset);
                  },
                  style: riverStyle,
                }).addTo(map);
                window.__mapOverlayLayers.push(l);
              }

              const lakeStyle = {
                fillColor: "#519ccc",
                fillOpacity: 1,
                color: "#519ccc",
                weight: 1,
              };

              function addLakeAtOffset(data, lngOffset) {
                const l = L.geoJSON(data, {
                  coordsToLatLng: function (coords) {
                    return new L.LatLng(coords[1], coords[0] + lngOffset);
                  },
                  style: lakeStyle,
                }).addTo(map);
                window.__mapOverlayLayers.push(l);
              }

              window.__mapOverlayLayers = [];

              setLayer(currentLayerIndex);

              fetch(
                "https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/10m/physical/ne_10m_land.json",
              )
                .then((res) => res.json())
                .then((landData) => {
                  addLandAtOffset(landData, -720);
                  addLandAtOffset(landData, -360);
                  addLandAtOffset(landData, 0);
                  addLandAtOffset(landData, 360);
                  addLandAtOffset(landData, 720);

                  return fetch(
                    "https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/10m/physical/ne_10m_rivers_lake_centerlines.json",
                  );
                })
                .then((res) => res.json())
                .then((riverData) => {
                  addRiverAtOffset(riverData, -720);
                  addRiverAtOffset(riverData, -360);
                  addRiverAtOffset(riverData, 0);
                  addRiverAtOffset(riverData, 360);
                  addRiverAtOffset(riverData, 720);

                  return fetch(
                    "https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/10m/physical/ne_10m_lakes.json",
                  );
                })
                .then((res) => res.json())
                .then((lakeData) => {
                  addLakeAtOffset(lakeData, -720);
                  addLakeAtOffset(lakeData, -360);
                  addLakeAtOffset(lakeData, 0);
                  addLakeAtOffset(lakeData, 360);
                  addLakeAtOffset(lakeData, 720);
                });
            });
          })();
        </script>
      </div>
    </div>
  </div>
</section>
