name: Process Glider Data
on:
  push:
    branches: [main]
    paths:
      - "static/data/glider/raw/*.csv"
  workflow_dispatch:
jobs:
  process-and-plot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Process glider data
        run: |
          python scripts/glider_data_processing.py \
            static/data/glider/raw/ \
            static/data/glider/processed/glider_data_processed.csv

      - name: Generate plots
        run: |
          python scripts/glider_plotting.py \
            static/data/glider/processed/glider_data_processed.csv \
            static/images/glider

      - name: Commit generated outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/glider/processed/glider_data_processed.csv static/images/glider/
          git diff --cached --quiet \
            && echo "Nothing changed — skipping commit" \
            || git commit -m "chore: auto-update glider plots"
          git push
